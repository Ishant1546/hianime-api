<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeVerse - Local Backend Tester</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .config-panel {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input, select {
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      outline: none;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      padding: 10px 18px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    .status-bar {
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 6px 12px;
      background: #0f172a;
      border-radius: 4px;
    }

    .player-container {
      margin-bottom: 30px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .anime-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      border: 2px solid transparent;
    }

    .anime-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .anime-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .card-info {
      padding: 10px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-id {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AnimeVerse - Backend Stream Tester</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Connected to HiAnime API v2.0.0 Endpoints.</p>
    </header>

    <!-- Backend Configuration & Custom Anime Input -->
    <div class="config-panel">
      <div class="input-group">
        <input type="text" id="apiBaseUrl" value="https://hianime-api-private.onrender.com/api/v1" placeholder="Backend Base URL">
      </div>
      <div class="input-group">
        <input type="text" id="customAnimeId" placeholder="Enter Anime Slug/ID (e.g., naruto-20)" value="naruto-20">
        <input type="number" id="customEpNum" value="1" style="max-width: 90px;" placeholder="Ep">
        <select id="subOrDub">
          <option value="sub">Sub (JP)</option>
          <option value="dub">Dub (EN/HI)</option>
        </select>
        <button onclick="testCustomAnime()">Fetch & Play</button>
      </div>
      <div class="status-bar" id="statusText">Ready to fetch stream...</div>
    </div>

    <!-- Active Video Player -->
    <div class="player-container">
      <iframe id="videoPlayer" src="about:blank" allowfullscreen></iframe>
    </div>

    <!-- Preset Anime Grid -->
    <h2 style="margin-bottom: 16px; font-size: 1.2rem;">Quick Select Popular Anime</h2>
    <div class="grid" id="animeGrid"></div>
  </div>

  <script>
    // Popular HiAnime Slugs & Poster Presets
    const presetAnime = [
      { id: "naruto-20", title: "Naruto", img: "https://cdn.myanimelist.net/images/anime/13/11403.jpg" },
      { id: "one-piece-100", title: "One Piece", img: "https://cdn.myanimelist.net/images/anime/1244/138851.jpg" },
      { id: "attack-on-titan-112", title: "Attack on Titan", img: "https://cdn.myanimelist.net/images/anime/10/47347.jpg" },
      { id: "demon-slayer-kimetsu-no-yaiba-47", title: "Demon Slayer", img: "https://cdn.myanimelist.net/images/anime/1286/99889.jpg" },
      { id: "fullmetal-alchemist-brotherhood-11", title: "Fullmetal Alchemist: B", img: "https://cdn.myanimelist.net/images/anime/1208/94745.jpg" },
      { id: "jujutsu-kaisen-534", title: "Jujutsu Kaisen", img: "https://cdn.myanimelist.net/images/anime/1171/109222.jpg" }
    ];

    const grid = document.getElementById('animeGrid');
    const player = document.getElementById('videoPlayer');
    const statusText = document.getElementById('statusText');

    // Render Preset Cards
    presetAnime.forEach(anime => {
      const card = document.createElement('div');
      card.className = 'anime-card';
      card.onclick = () => loadStream(anime.id, 1);
      card.innerHTML = `
        <img src="${anime.img}" alt="${anime.title}">
        <div class="card-info">
          <div class="card-title">${anime.title}</div>
          <div class="card-id">ID: ${anime.id}</div>
        </div>
      `;
      grid.appendChild(card);
    });

    function testCustomAnime() {
      const animeId = document.getElementById('customAnimeId').value.trim();
      const epNum = document.getElementById('customEpNum').value || 1;
      if (!animeId) {
        alert('Please enter a valid Anime ID or Slug');
        return;
      }
      loadStream(animeId, epNum);
    }

    async function loadStream(animeId, episodeNumber = 1) {
      const baseUrl = document.getElementById('apiBaseUrl').value.replace(/\/$/, "");
      const category = document.getElementById('subOrDub').value;

      statusText.innerText = `Fetching episodes list for ${animeId}...`;

      try {
        // 1. Get episode list to retrieve specific episode ID
        const epListRes = await fetch(`${baseUrl}/episodes/${animeId}`);
        const epListData = await epListRes.json();
        
        // Find the specific episode
        const episodeObj = epListData.data?.episodes?.find(e => e.number == episodeNumber) || epListData.data?.episodes?.[0];
        
        if (!episodeObj) {
          statusText.innerText = `Error: Could not find episode ${episodeNumber} for ${animeId}`;
          return;
        }

        const episodeId = episodeObj.episodeId;
        statusText.innerText = `Found Episode ID: ${episodeId}. Fetching servers...`;

        // 2. Query available servers for this episode
        const serverRes = await fetch(`${baseUrl}/servers?episodeId=${episodeId}`);
        const serverData = await serverRes.json();
        
        const availableServers = serverData.data?.[category] || serverData.data?.sub || [];
        if (availableServers.length === 0) {
          statusText.innerText = `No ${category} servers available for episode ${episodeNumber}`;
          return;
        }

        const primaryServer = availableServers[0].serverName || "hd-1";
        statusText.innerText = `Loading embed from Server: ${primaryServer}...`;

        // 3. Set embed player URL using /embed or /embed/{server}/{id}/{type}
        const embedUrl = `${baseUrl}/embed/${primaryServer}/${episodeId}/${category}`;
        console.log(`Setting embed URL: ${embedUrl}`);
        
        player.src = embedUrl;
        statusText.innerText = `Playing ${animeId} - Episode ${episodeNumber} (${category.toUpperCase()}) on [${primaryServer}]`;

      } catch (err) {
        console.error("API Fetch Error:", err);
        statusText.innerText = `Failed to fetch stream details from backend. Check console logs.`;
      }
    }
  </script>
</body>
</html>
