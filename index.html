<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Iframe Player</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #3b82f6;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .player-container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    /* Responsive 16:9 Aspect Ratio Box */
    .responsive-iframe-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 aspect ratio */
      background-color: #000;
    }

    .responsive-iframe-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .controls-bar {
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
    }

    .input-group {
      display: flex;
      flex: 1;
      gap: 8px;
      min-width: 280px;
    }

    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    button {
      padding: 8px 16px;
      background: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <!-- 16:9 Responsive Iframe Box -->
    <div class="responsive-iframe-wrapper">
      <iframe 
        id="mainPlayer"
        src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ"
        title="Video Player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <!-- Controls to Switch URL -->
    <div class="controls-bar">
      <div class="input-group">
        <input 
          type="text" 
          id="videoUrlInput" 
          placeholder="Paste embed URL or iframe link..." 
          value="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ" 
        />
        <button onclick="updatePlayerSource()">Load Video</button>
      </div>
    </div>
  </div>

  <script>
    function updatePlayerSource() {
      const inputVal = document.getElementById('videoUrlInput').value.trim();
      const playerFrame = document.getElementById('mainPlayer');

      if (!inputVal) return;

      // Extract src if an entire <iframe> HTML snippet was pasted
      if (inputVal.startsWith('<iframe')) {
        const srcMatch = inputVal.match(/src=["']([^"']+)["']/);
        if (srcMatch && srcMatch[1]) {
          playerFrame.src = srcMatch[1];
          return;
        }
      }

      // Otherwise treat as direct URL
      playerFrame.src = inputVal;
    }
  </script>

</body>
</html>
